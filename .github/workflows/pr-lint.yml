name: PR lint

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: write
  deployments: read
  pull-requests: write # needed to annotate code
  statuses: write
  checks: write
  packages: read

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  build:
    runs-on: ubuntu-latest
    environment: pull_request_unsafe
    name: Lint

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal token
          fetch-depth: 0 # otherwise, you will failed to push refs to dest repo

      - name: Use Node.js
        uses: ./.github/actions/setup-node
        with:
          NPM_TOKEN: ${{ github.token }}

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

      - name: Build
        run: pnpm build

      - name: stylelint
        continue-on-error: true
        run: |
          pnpm stylelint:run --concurrency=1

      - name: oxlint
        continue-on-error: true
        run: |
          pnpm oxlint:run --concurrency=1

      - name: Merge lint
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/lint-merge-report
        with:
          base-branch: master
          head-branch: ${{ github.head_ref }}

      - name: Annotate Code Linting Results
        if: github.event_name == 'pull_request'
        uses: ataylorme/eslint-annotate-action@5a8d8ab89a57679e90c32750e0f382e9d8570750 #v4.0.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          report-json: ./eslint-report.json
