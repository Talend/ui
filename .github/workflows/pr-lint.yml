name: PR lint

on:
  pull_request:

permissions:
  contents: write
  deployments: read
  pull-requests: write # needed to annotate code
  statuses: write
  checks: write
  packages: read

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: pull_request_unsafe
    name: Lint

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal token
          fetch-depth: 0 # otherwise, you will failed to push refs to dest repo

      - name: Use Node.js
        uses: ./.github/actions/setup-node
        with:
          NPM_TOKEN: ${{ github.token }}

      - name: Install
        run: yarn install --frozen-lockfile --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

      - name: Build
        run: yarn build

      - name: eslint + stylelint
        continue-on-error: true
        id: eslint
        run: |
          yarn eslint:run --concurrency=1
          yarn stylelint:run --concurrency=1

      - name: Merge lint
        uses: ./.github/actions/lint-merge-report
        with:
          base-branch: master
          head-branch: ${{ github.head_ref }}

      - name: Annotate Code Linting Results
        uses: ataylorme/eslint-annotate-action@d57a1193d4c59cbfbf3f86c271f42612f9dbd9e9 #v3.0.0
        with:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          report-json: ./eslint-report.json
