name: yarn-deduplicate

on:
  pull_request:
    paths:
      - "yarn.lock"

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

permissions:
  contents: write
  deployments: read
  pull-requests: write # needed to write comment in PR

jobs:
  dedupe:
    runs-on: ubuntu-latest
    name: Deduplicate
    environment: pull_request_unsafe

    steps:
      - name: Checkout sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
        with:
          persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal token
          fetch-depth: 0 # otherwise, you will failed to push refs to dest repo

      - name: Use Node.js
        uses: ./.github/actions/setup-node
        with:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: yarn-deduplicate
        id: deduplicate
        run: |
          yarn install --frozen-lockfile --ignore-scripts
          yarn yarn-deduplicate
          echo "::set-output name=diff::$(git status --short yarn.lock)"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit dedupe
        if: steps.deduplicate.outputs.diff
        uses: actions-js/push@968f4695ca558093eadb24ad83cc5891f47e0cdc #1.6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message: "chore: yarn-deduplicate"
          branch: ${{ github.head_ref }}
